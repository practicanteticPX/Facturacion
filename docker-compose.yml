services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "10.50.8.10:4001:4001"
    environment:
      - DATABASE_URL=postgresql://admin@10.50.7.4:5432/SERV_QPREX
      - DATABASE_URL_2=postgresql://admin@10.50.7.4:5432/DB_QPREX
      - CERTS_PATH=/app/certs
      - PORT=4001
      # FRONTEND_URL ya no es necesaria - CORS ahora acepta HTTP/HTTPS desde cualquier origen
      # - FRONTEND_URL=http://10.50.8.10:3001
      - AD_PROTOCOL=ldap
      - AD_HOSTNAME=10.50.7.3
      - AD_PORT=389
      - AD_BASE_DN=DC=flexxo,DC=local
      - AD_SEARCH_BASE=DC=flexxo,DC=local
      - AD_BIND_USER=user.glpi@flexxo.local
      - "AD_BIND_PASS=!T8909pX*-"
      - JWT_SECRET=prexxa-facturas-secret-2024-change-in-production
      - JWT_EXPIRES_IN=8h
      - DOCUPREX_API_URL=http://10.50.8.10:5001
      - DOCUPREX_INGEST_TOKEN=docuprex-facturacion-sync-2026
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./certs:/app/certs:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_GRAPHQL_URL=https://facturacion.prexxa.com/graphql
    ports:
      - "10.50.8.10:3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

