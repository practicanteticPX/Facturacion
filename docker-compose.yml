services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_2=${DATABASE_URL_2}
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL}
      - AD_PROTOCOL=${AD_PROTOCOL}
      - AD_HOSTNAME=${AD_HOSTNAME}
      - AD_PORT=${AD_PORT}
      - AD_BASE_DN=${AD_BASE_DN}
      - AD_SEARCH_BASE=${AD_SEARCH_BASE}
      - AD_BIND_USER=${AD_BIND_USER}
      - AD_BIND_PASS=${AD_BIND_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_GRAPHQL_URL=${REACT_APP_GRAPHQL_URL:-http://localhost:4000/graphql}
      - HOST=0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
