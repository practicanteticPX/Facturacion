services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "192.168.0.30:4001:4001"
    environment:
      - DATABASE_URL=postgresql://svc_app@10.50.7.4:5432/SERV_QPREX
      - DATABASE_URL_2=postgresql://svc_app@10.50.7.4:5432/DB_QPREX
      - CERTS_PATH=/app/certs
      - PORT=4001
      # FRONTEND_URL ya no es necesaria - CORS ahora acepta HTTP/HTTPS desde cualquier origen
      # - FRONTEND_URL=http://192.168.0.30:3001
      - AD_PROTOCOL=ldap
      - AD_HOSTNAME=192.168.0.253
      - AD_PORT=389
      - AD_BASE_DN=DC=prexxa,DC=local
      - AD_SEARCH_BASE=DC=prexxa,DC=local
      - AD_BIND_USER=glpi.sync@prexxa.local
      - AD_BIND_PASS=adminPre8909
      - JWT_SECRET=prexxa-facturas-secret-2024-change-in-production
      - JWT_EXPIRES_IN=8h
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./certs:/app/certs:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "192.168.0.30:3001:3001"
    environment:
      # Backend con HTTPS en el mismo host, ruta /graphql
      - REACT_APP_GRAPHQL_URL=https://recepcion-facturacion.com/graphql
      - HOST=0.0.0.0
      - PORT=3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
